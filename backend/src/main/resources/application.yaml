spring:
  application:
    name: weeklyreport

  # Boot starts the MySQL container from compose.yaml on run.
  # start-only => the container is NOT torn down when the app stops,
  # so seeded data survives restarts during development.
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/weeklyreport?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:weeklyreport}
    password: ${SPRING_DATASOURCE_PASSWORD:weeklyreport}

  jpa:
    # Flyway owns the schema. Hibernate only verifies the entities still
    # match it, so entity/migration drift fails fast at startup.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # A host that assigns the port — Render, Heroku, Cloud Run — passes it as
  # $PORT and routes to nothing else. Locally PORT is unset, so this stays
  # 8080 and nothing about running it on a laptop changes.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Override in every deployed environment. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
    cookie-name: wr_token
    # Deployed over HTTPS with the frontend on another domain, set
    # JWT_SECURE_COOKIE=true and JWT_SAME_SITE=None.
    secure-cookie: ${JWT_SECURE_COOKIE:false}
    same-site: ${JWT_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
  ai:
    # The assistant is optional. With no key it switches itself off, the endpoint
    # answers 503 and the widget hides — the rest of the application is untouched,
    # so a reviewer without a Groq account can still run everything else.
    enabled: ${AI_ENABLED:true}
    api-key: ${GROQ_API_KEY:}
    # Any OpenAI-compatible endpoint works; only these two lines change.
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    max-tool-turns: 4
    max-history-messages: 12
    timeout-seconds: 45
  bootstrap:
    # Created once, at startup, and only when the database contains no manager.
    # Change the password in any deployed environment.
    manager:
      enabled: ${BOOTSTRAP_MANAGER_ENABLED:true}
      name: ${BOOTSTRAP_MANAGER_NAME:Team Manager}
      email: ${BOOTSTRAP_MANAGER_EMAIL:manager@sisenco.local}
      password: ${BOOTSTRAP_MANAGER_PASSWORD:Manager@12345}

logging:
  level:
    org.springframework.security: INFO
